<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>烟迹 · 图标裁切</title>
<style>
:root{--paper:#F5F0E6;--ink:#2B2622;--ink2:#57504A;--faint:#7A7063;--line:#DCD3C2;--amberD:#7A4E1F;
  --serif:Calibri,"Source Han Serif SC","Noto Serif SC","Songti SC",Georgia,serif;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 24px) 20px 40px}
h1{font-size:22px;letter-spacing:.3em;margin-bottom:8px}
.tip{font-size:13px;color:var(--faint);line-height:1.8;text-align:center;margin-bottom:18px}
.pick-btn{background:var(--ink);color:var(--paper);border:0;border-radius:9px;padding:13px 28px;
  font-family:inherit;font-size:16px;letter-spacing:.12em;cursor:pointer;margin-bottom:20px}
#pick{display:none}
#stage{width:min(360px,88vw);height:min(360px,88vw);display:none;
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.bar{display:none;align-items:center;gap:12px;width:min(360px,88vw);margin-top:16px}
.bar label{font-size:13px;color:var(--faint);white-space:nowrap}
.bar input{flex:1;accent-color:#2B2622}
#save{display:none;margin-top:20px;background:var(--amberD);color:#F5EFE2;border:0;border-radius:9px;
  padding:14px 34px;font-family:inherit;font-size:16px;letter-spacing:.12em;cursor:pointer}
.hint{margin-top:14px;font-size:12px;color:var(--faint)}
</style>
</head>
<body>
<h1>烟 迹</h1>
<p class="tip">选一张图，单指拖动取景、双指捏合缩放（电脑：拖动＋滚轮或滑杆）。<br>确认后点下载，得到 512×512 的 icon.png，上传到仓库即可。</p>
<button class="pick-btn" id="pickBtn">选 择 图 片</button>
<input type="file" id="pick" accept="image/*">
<div id="stage"><canvas id="cv" width="720" height="720"></canvas></div>
<div class="bar" id="bar"><label>缩放</label><input type="range" id="zoom" min="0" max="1" step="0.001"></div>
<button id="save">下 载 icon.png</button>
<p class="hint" id="hint"></p>
<script>
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const S=cv.width;                       // 内部 720，保证清晰
let img=null,scale=1,minZ=1,maxZ=5,ox=S/2,oy=S/2;

function clampPos(){                    // 图像永远盖满方框，不允许露边
  const w2=img.width*scale/2,h2=img.height*scale/2;
  ox=w2*2<S?S/2:Math.max(S-w2,Math.min(w2,ox));
  oy=h2*2<S?S/2:Math.max(S-h2,Math.min(h2,oy));
}
function draw(){
  ctx.clearRect(0,0,S,S);
  ctx.drawImage(img,ox-img.width*scale/2,oy-img.height*scale/2,img.width*scale,img.height*scale);
}
function setZoom(z,px,py){
  z=Math.max(minZ,Math.min(maxZ,z));
  if(px!==undefined){const k=z/scale;ox=px+(ox-px)*k;oy=py+(oy-py)*k;}
  scale=z;clampPos();draw();
  $('#zoom').value=(z-minZ)/(maxZ-minZ);
}
 $('#pickBtn').onclick=()=>$('#pick').click();
 $('#pick').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f);
  const im=new Image();
  im.onload=()=>{
    img=im;URL.revokeObjectURL(url);
    minZ=Math.max(S/im.width,S/im.height);maxZ=minZ*5;
    scale=minZ;ox=S/2;oy=S/2;
    $('#stage').style.display='block';
    $('#bar').style.display='flex';
    $('#save').style.display='inline-block';
    $('#hint').textContent='建议把人物主体放进方框中央；导出即为主屏图标，iOS 会自动裁圆角';
    clampPos();draw();
  };
  im.src=url;
};
 $('#zoom').oninput=e=>setZoom(minZ+(maxZ-minZ)*+e.target.value);

/* 触屏＋鼠标统一用 Pointer 事件 */
const pts=new Map();let lastDist=0;
const toCV=e=>{const r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)/r.width*S,y:(e.clientY-r.top)/r.height*S};};
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,toCV(e));
  if(pts.size===2){const a=[...pts.values()];
    lastDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
});
cv.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  const prev=pts.get(e.pointerId),cur=toCV(e);
  pts.set(e.pointerId,cur);
  if(pts.size===1){ox+=cur.x-prev.x;oy+=cur.y-prev.y;clampPos();draw();}
  else if(pts.size===2){
    const a=[...pts.values()];
    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    const mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
    if(lastDist>0)setZoom(scale*d/lastDist,mid.x,mid.y);
    lastDist=d;
  }
});
const up=e=>{pts.delete(e.pointerId);lastDist=0;};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();
  const p=toCV(e);
  setZoom(scale*(e.deltaY<0?1.08:1/1.08),p.x,p.y);
},{passive:false});

/* 导出 512×512 PNG */
 $('#save').onclick=()=>{
  if(!img)return;
  const out=document.createElement('canvas');out.width=512;out.height=512;
  const c2=out.getContext('2d'),k=512/S;
  c2.drawImage(img,(ox-img.width*scale/2)*k,(oy-img.height*scale/2)*k,
    img.width*scale*k,img.height*scale*k);
  out.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='icon.png';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    $('#hint').textContent='已开始下载，去“文件”App 的“下载”里找 icon.png';
  },'image/png');
};
</script>
</body>
</html>
