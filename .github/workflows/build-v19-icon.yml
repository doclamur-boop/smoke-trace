name: Build v19 PNG icons
on:
  push:
    paths:
      - '.icon-build/trigger'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild PNG icons
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, re
          svg = open('icon-v19.svg', encoding='utf-8').read()
          m = re.search(r'base64,([^"\']+)', svg)
          if not m:
              raise SystemExit('embedded PNG not found')
          open('icon-v19-192.png','wb').write(base64.b64decode(m.group(1)))
          PY
          convert icon-v19-192.png -filter Lanczos -resize 512x512 -unsharp 0x0.35 icon-v19-512.png
          file icon-v19-192.png icon-v19-512.png
      - name: Commit icons
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add icon-v19-192.png icon-v19-512.png
          git commit -m 'Build standard PNG icons from approved artwork'
          git push
