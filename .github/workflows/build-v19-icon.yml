name: Build v19 PNG icons
on: push
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild PNG icons
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, io, re
          from PIL import Image
          svg = open('icon-v19.svg', encoding='utf-8').read()
          m = re.search(r'base64,([^"\']+)', svg)
          if not m:
              raise SystemExit('embedded PNG not found')
          raw = base64.b64decode(m.group(1))
          src = Image.open(io.BytesIO(raw)).convert('RGB')
          src.save('icon-v19-192.png', 'PNG', optimize=True)
          src.resize((512,512), Image.Resampling.LANCZOS).save('icon-v19-512.png', 'PNG', optimize=True)
          print('source:', src.size)
          PY
          file icon-v19-192.png icon-v19-512.png
      - name: Commit icons
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add icon-v19-192.png icon-v19-512.png
          git commit -m 'Build standard PNG icons from approved artwork'
          git push
